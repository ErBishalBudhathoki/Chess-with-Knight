server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /chessknight {
        try_files /chessknight/index.html =404;
    }

    location /chessknight/ {
        try_files $uri $uri/ /chessknight/index.html;
    }
}